# application.yml
server:
  port: 8083

spring:
  application:
    name: orchestrator-service

  # ==========================================
  # DATABASE
  # ==========================================
  datasource:
    url: jdbc:mysql://localhost:3306/brain_service_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ==========================================
  # REDIS
  # ==========================================
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  # ==========================================
  # KAFKA
  # ==========================================
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: orchestrator-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "idea.fuel_payment.order_service.dto.kafka.OrderCreatedEvent:idea.fuel_payment.orchestrator_service.kafka.dto.OrderCreatedEvent"
        max.poll.records: 10
        max.poll.interval.ms: 300000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    listener:
      ack-mode: manual
      concurrency: 3

# ==========================================
# SAGA CONFIGURATION
# ==========================================
saga:
  lock:
    timeout-seconds: 300
    prefix: "saga:lock:"
  timeout:
    default-step-timeout-seconds: 60
    pump-wait-timeout-seconds: 600
  retry:
    max-attempts: 3
    backoff-ms: 1000

# ==========================================
# KAFKA TOPICS
# ==========================================
kafka:
  topics:
    order-created: fuel.order.created
    saga-step-command: fuel.saga.step.command
    saga-step-response: fuel.saga.step.response
    pump-completed: fuel.pump.completed
    saga-completed: fuel.saga.completed
    pump-activated: fuel.pump.activated
    payment-success: fuel.payment.success
    inventory-updated: fuel.inventory.updated
    order-completed: fuel.order.completed

# ==========================================
# ACTUATOR
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# ==========================================
# LOGGING
# ==========================================
logging:
  level:
    com.fuelstation.orchestrator: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{sagaId}] %-5level %logger{36} - %msg%n"