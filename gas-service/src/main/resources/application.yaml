server:
  port: 8081

spring:
  application:
    name: gas-service

  datasource:
    url: jdbc:mysql://localhost:3306/gas_service_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
kafka:
  topics:
    saga-step-command: fuel.pump.activated
    saga-step-response: fuel.pump.completed

logging:
  level:
    root: INFO
    idea.fuel_payment.gas_service: DEBUG