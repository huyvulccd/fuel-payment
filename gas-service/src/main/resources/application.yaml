server:
  port: 8081

spring:
  application:
    name: gas-service

  datasource:
    url: jdbc:mysql://localhost:3306/gas_service_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  # ==========================================
  # KAFKA
  # ==========================================
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: orchestrator-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "idea.fuel_payment.orchestrator_service.kafka.dto.SagaStepCommand:idea.fuel_payment.gas_service.kafka.dto.SagaStepCommand"

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    listener:
      ack-mode: manual
      concurrency: 3
kafka:
  topics:
    saga-step-command: fuel.saga.step.command
    saga-step-response: fuel.saga.step.response

logging:
  level:
    root: INFO
    idea.fuel_payment.gas_service: DEBUG